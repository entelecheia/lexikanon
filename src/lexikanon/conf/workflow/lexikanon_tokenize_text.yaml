# hyfi run workflow=lexikanon_tokenize_text [tokenizer=mecab]
defaults:
  - /tokenizer@_global_.tokenizer: simple

name: lexikanon_tokenize_text
steps:
  - run: lexikanon.pipes.tokenize.tokenize_texts
    with:
      texts: 금통위는 따라서 물가안정과 병행, 경기상황에 유의하는 금리정책을 펼쳐나가기로 했다고 밝혔다.
      tokenizer: ${tokenizer}
  - run: builtins.print
