[project]
name = "lexikanon"
version = "0.6.5"
description = "Korean and English tokenizers, normalizers, and stopwords, with HyFI 2.0 config groups"
authors = [{ name = "Young Joon Lee", email = "entelecheia@hotmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["tokenizer", "korean", "nlp", "mecab", "hyfi"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: Korean",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = [
    "ekonlpy>=2.2",
    "ftfy>=6.1.1",
    "hyfi>=2,<3",
    "nltk>=3.9",
    "numpy>=1.23.5",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
datasets = ["datasets>=2.14"]
similarity = ["matplotlib>=3.7", "pandas>=1.5.3", "scikit-learn>=1.4", "scipy>1.10"]

[project.urls]
Homepage = "https://lexikanon.entelecheia.ai"
Repository = "https://github.com/entelecheia/lexikanon"
Documentation = "https://lexikanon.entelecheia.ai"
Changelog = "https://github.com/entelecheia/lexikanon/blob/main/CHANGELOG.md"

[project.entry-points."hyfi.plugins"]
lexikanon = "lexikanon.conf"

[dependency-groups]
test = ["pytest>=8", "pytest-cov>=5", "lexikanon[datasets,similarity]"]
lint = ["ruff>=0.15", "mypy>=1.13", "types-PyYAML"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]
dev = [{ include-group = "test" }, { include-group = "lint" }, { include-group = "docs" }]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lexikanon"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S", "C4", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"] # Korean, hanja, and typographic characters are data here

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S603", "S607"]
"src/lexikanon/pipes/*" = ["S107"] # `token_col` defaults are column names

[tool.mypy]
python_version = "3.11"
files = ["src/lexikanon"]
ignore_missing_imports = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.coverage.run]
branch = true
source = ["lexikanon"]

[tool.coverage.report]
fail_under = 55 # 1.x gate was 50; vendored hangul/hanja helpers are mostly untested
skip_empty = true
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", 'if __name__ == "__main__":']

[tool.semantic_release]
tag_format = "v{version}"
commit_parser = "conventional"
major_on_zero = true
version_source = "tag"
commit_message = ":rocket: {version}\n\nAutomatically generated by python-semantic-release"
# Keep uv.lock in step with the bumped version, or `uv lock --locked` fails after a release.
# One && chain: PSR runs this with `sh -c` and no `-e`, so a failing step must stop the build.
build_command = "pip install uv==0.13.1 && uv lock --upgrade-package \"$PACKAGE_NAME\" && git add uv.lock && uv build"
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/lexikanon/_version.py:__version__"]

[tool.semantic_release.branches.main]
match = "release"
prerelease = false

[tool.semantic_release.changelog]
insertion_flag = "<!--next-version-placeholder-->"
mode = "update"

[tool.semantic_release.remote]
type = "github"
token = { env = "GH_TOKEN" }
